<!DOCTYPE html>
<html lang="en" class="auth-pending">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>Black Sea Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/leaflet.pattern@0.1.0/dist/leaflet.pattern-src.js"></script>

  <style>
    html,
    body,
    #map {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    /* Keep the map hidden until Firebase confirms authentication. */
    html.auth-pending body {
      visibility: hidden;
    }

    .panel,
    .top-right,
    .legend {
      position: absolute;
      z-index: 1000;
      box-sizing: border-box;

      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(20, 55, 80, 0.12);
      border-radius: 10px;

      box-shadow:
        0 6px 20px rgba(0, 0, 0, 0.18);
    }

    /* =====================================================
       CONTROL PANEL
       ===================================================== */

    .panel {
      top: 12px;
      left: 12px;

      width: 310px;
      max-height: calc(100vh - 24px);
      padding: 11px 13px;

      overflow-y: auto;
    }

    .panel h3 {
      margin: 0 0 9px;

      color: #162f42;
      font-size: 14px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;

      margin: 6px 0;
    }

    .row > label {
      min-width: 76px;

      color: #333333;
      font-size: 12px;
    }

    select {
      width: 100%;
      min-width: 0;
      padding: 6px 8px;

      border: 1px solid #c8d2da;
      border-radius: 7px;

      background: #ffffff;
      color: #222222;

      font-size: 12px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;

      margin: 8px 0 4px;

      font-size: 12px;
    }

    .checkbox-row input {
      margin: 0;
      accent-color: #1d6fa5;
    }

    .panel-divider {
      height: 1px;
      margin: 11px 0;

      background: #dce3e8;
    }

    .filter-section-title {
      margin: 0 0 8px;

      color: #17384f;
      font-size: 12px;
      font-weight: 700;
    }

    .species-filter-list {
      display: grid;
      gap: 6px;
    }

    .species-filter-item {
      display: flex;
      align-items: center;
      gap: 8px;

      min-height: 22px;

      color: #333333;
      font-size: 12px;
      cursor: pointer;
    }

    .species-filter-item input {
      margin: 0;
      accent-color: #17384f;
    }

    .species-filter-item em {
      min-width: 0;
    }

    .filter-symbol-container {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 16px;

      width: 16px;
      height: 16px;
    }

    .hint {
      margin-top: 8px;

      color: #555555;
      font-size: 11px;
      line-height: 1.3;
    }

    .observation-controls {
      margin-top: 8px;
    }

    .context-filter-section {
      margin-top: 10px;
    }

    .context-filter-note {
      margin-top: 7px;

      color: #5a6670;
      font-size: 11px;
      line-height: 1.3;
    }

    /* =====================================================
       LOGIN
       ===================================================== */

    .top-right {
      top: 12px;
      right: 12px;

      display: flex;
      align-items: center;
      gap: 10px;

      padding: 10px 12px;
    }

    #userEmail {
      max-width: 180px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      font-size: 13px;
    }

    .top-right button {
      padding: 8px 12px;

      border: none;
      border-radius: 8px;

      background: #17384f;
      color: #ffffff;

      cursor: pointer;
      font-weight: 600;
    }

    /* =====================================================
       SPECIES SHAPES
       ===================================================== */

    .species-shape {
      --shape-colour: #777777;

      display: inline-block;
      flex-shrink: 0;
    }

    .shape-circle {
      width: 10px;
      height: 10px;

      border: 1px solid rgba(0, 0, 0, 0.32);
      border-radius: 50%;

      background: var(--shape-colour);
    }

    .shape-square {
      width: 10px;
      height: 10px;

      border: 1px solid rgba(0, 0, 0, 0.32);
      border-radius: 2px;

      background: var(--shape-colour);
    }

    .shape-triangle {
      width: 0;
      height: 0;

      border-right: 6px solid transparent;
      border-bottom: 11px solid var(--shape-colour);
      border-left: 6px solid transparent;

      filter:
        drop-shadow(0 1px 0 rgba(0, 0, 0, 0.45));
    }

    .shape-diamond {
      width: 9px;
      height: 9px;

      border: 1px solid rgba(0, 0, 0, 0.32);
      border-radius: 1px;

      background: var(--shape-colour);
      transform: rotate(45deg);
    }

    /* =====================================================
       MAP SITE MARKERS
       ===================================================== */

    .site-marker-icon {
      overflow: visible !important;

      background: transparent !important;
      border: none !important;
    }

    .site-marker-cluster {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;

      min-width: 0;
      height: 22px;
      box-sizing: border-box;
      padding: 0;

      border: none;
      border-radius: 0;

      background: transparent;

      filter:
        drop-shadow(0 2px 2px rgba(0, 0, 0, 0.42));

      cursor: pointer;
      white-space: nowrap;

      transition:
        transform 0.16s ease,
        filter 0.16s ease;
    }

    .site-marker-cluster:hover {
      transform: scale(1.12);

      filter:
        drop-shadow(0 4px 4px rgba(0, 0, 0, 0.48));
    }

    .site-marker-symbol {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 12px;
      height: 13px;
    }

    .site-marker-cluster .shape-circle,
    .site-marker-cluster .shape-square {
      width: 8px;
      height: 8px;
    }

    .site-marker-cluster .shape-triangle {
      border-right-width: 5px;
      border-bottom-width: 9px;
      border-left-width: 5px;
    }

    .site-marker-cluster .shape-diamond {
      width: 7px;
      height: 7px;
    }


    .biotic-marker-icon {
      overflow: visible !important;

      background: transparent !important;
      border: none !important;
    }

    .biotic-pressure-marker {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 22px;
      height: 22px;
      box-sizing: border-box;

      border: 1.8px solid rgba(255, 255, 255, 0.98);
      border-radius: 50%;

      background: var(--pressure-colour, #999999);

      box-shadow:
        0 2px 5px rgba(0, 0, 0, 0.38),
        0 0 0 1px rgba(22, 56, 79, 0.28);

      cursor: pointer;

      transition:
        transform 0.16s ease,
        box-shadow 0.16s ease;
    }

    .biotic-pressure-marker:hover {
      transform: scale(1.14);

      box-shadow:
        0 4px 10px rgba(0, 0, 0, 0.42),
        0 0 0 2px rgba(255, 255, 255, 0.8);
    }

    /* =====================================================
       LEGEND
       ===================================================== */

    /* Default position: eDNA / no observations = bottom-left */
    .legend {
      left: 12px;
      right: auto;
      bottom: 20px;

      width: 260px;
      max-height: calc(100vh - 40px);
      padding: 0;

      overflow: hidden;

      transition:
        left 0.2s ease,
        right 0.2s ease,
        bottom 0.2s ease;
    }

    /* Biotic-pressure mode = bottom-right */
    .legend.is-biotic-mode {
      left: 12px;
      right: auto;
      bottom: 20px;

      width: 275px;
      max-height: calc(100vh - 100px);
    }

    .legend-toggle {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      width: 100%;
      padding: 10px 12px;

      border: 0;
      background: transparent;
      color: #17384f;

      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 750;
      text-align: left;
    }

    .legend-toggle-icon {
      font-size: 14px;
      line-height: 1;
    }

    .legend-content {
      box-sizing: border-box;
      max-height: calc(100vh - 100px);
      padding: 10px 12px;

      overflow-y: auto;
    }

    .legend-title {
      margin: 0 0 8px;

      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
    }

    .bar {
      height: 10px;

      border: 1px solid #dddddd;
      border-radius: 6px;
    }

    .legend-labels {
      display: flex;
      justify-content: space-between;

      margin-top: 6px;

      font-size: 12px;
    }

    .legend-divider {
      height: 1px;
      margin: 10px 0 8px;

      background: #dddddd;
    }

    .legend-line-item,
    .legend-fill-item,
    .species-legend-item {
      display: flex;
      align-items: center;
      gap: 8px;

      margin-top: 6px;

      color: #333333;
      font-size: 12px;
    }

    .species-legend-symbol {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 22px;

      width: 22px;
      height: 18px;
    }

    .legend-buoy {
      display: inline-block;
      width: auto;

      object-fit: contain;
    }

    .legend-buoy.coastal {
      height: 40px;
    }

    .legend-buoy.offshore {
      height: 28px;
    }

    .legend-line-symbol {
      display: inline-block;
      flex-shrink: 0;

      width: 24px;
      height: 0;

      border-top: 2px solid #7f7f7f;
    }

    .legend-hatch-symbol {
      display: inline-block;
      flex-shrink: 0;

      width: 24px;
      height: 14px;

      border: 1px solid #28a745;

      background:
        repeating-linear-gradient(
          -45deg,
          rgba(40, 167, 69, 0.75) 0,
          rgba(40, 167, 69, 0.75) 2px,
          transparent 2px,
          transparent 6px
        );
    }


    .pressure-legend-subtitle {
      margin: -3px 0 5px;

      color: #273b4a;
      font-size: 12px;
      font-style: normal;
      font-weight: 650;
    }

    .pressure-legend-subtitle.is-scientific {
      font-style: italic;
    }

    /* Scientific names in the biotic-pressure selector */
    #bioticPressureType.scientific-selected {
      font-style: italic;
    }

    #bioticPressureType option.scientific-option {
      font-style: italic;
    }

    #bioticPressureType option:not(.scientific-option) {
      font-style: normal;
    }

    .pressure-legend-item {
      display: flex;
      align-items: center;
      gap: 8px;

      margin-top: 5px;

      color: #333333;
      font-size: 11px;
      line-height: 1.2;
    }

    .pressure-legend-swatch {
      display: inline-block;
      flex: 0 0 12px;

      width: 12px;
      height: 12px;

      border: 1px solid rgba(0, 0, 0, 0.18);
      border-radius: 50%;

      background: var(--pressure-colour, #999999);
    }

    /* =====================================================
       RASTER COLOUR BARS
       ===================================================== */

    .temp-bar {
      background:
        linear-gradient(
          90deg,
          #2c7bb6,
          #00a6ca,
          #00ccbc,
          #90eb9d,
          #ffff8c,
          #f9d057,
          #f29e2e,
          #e76818,
          #d7191c
        );
    }

    .salinity-bar {
      background:
        linear-gradient(
          90deg,
          #313695,
          #4575b4,
          #74add1,
          #abd9e9,
          #e0f3f8,
          #fee090,
          #fdae61,
          #f46d43,
          #d73027
        );
    }

    .oxygen-bar {
      background:
        linear-gradient(
          90deg,
          #d73027,
          #f46d43,
          #fdae61,
          #fee08b,
          #d9ef8b,
          #91cf60,
          #4575b4,
          #313695
        );
    }

    .current-bar {
      background:
        linear-gradient(
          90deg,
          #2c7bb6,
          #5aa7d8,
          #91d3c2,
          #d9ef8b,
          #fee08b,
          #fdae61,
          #f46d43,
          #d73027
        );
    }

    .bathy-bar {
      background:
        linear-gradient(
          90deg,
          #08306b,
          #08519c,
          #2171b5,
          #4292c6,
          #6baed6,
          #9ecae1,
          #c6dbef,
          #deebf7
        );
    }

    /* =====================================================
       STURGEON POPUP
       ===================================================== */

    .species-info-title {
      margin: 0 0 8px;

      color: #172f40;

      font-size: 13px;
      font-weight: 700;
      line-height: 1.3;

      /* Preserve intentional \n line breaks from the GeoJSON title. */
      white-space: pre-line;
    }

    .detected-species-list {
      display: grid;
      gap: 5px;

      margin-bottom: 10px;
    }

    .detected-species-item {
      display: flex;
      align-items: center;
      gap: 7px;

      font-size: 12px;
      font-weight: 650;
    }

    .detected-species-item em {
      color: var(--item-colour);
    }

    .site-meta {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 4px 10px;

      margin-bottom: 0;

      font-size: 12px;
      line-height: 1.3;
    }

    .site-meta-label {
      color: #555555;
      font-weight: 600;
    }

    .hidden {
      display: none !important;
    }

    .sturgeon-popup-card {
      width: 360px;
      max-width: calc(100vw - 48px);
      box-sizing: border-box;
      padding: 14px 16px;

      border-left: 6px solid var(--summary-colour, #17384f);
    }


    .biotic-popup-card {
      width: 390px;
      max-width: calc(100vw - 48px);
      box-sizing: border-box;
      padding: 14px 16px;

      border-left: 6px solid var(--summary-colour, #17384f);
    }

    .biotic-popup-divider {
      height: 1px;
      margin: 11px 0 9px;

      background: #dfe5e9;
    }

    .biotic-popup-heading {
      margin: 0 0 7px;

      color: #172f40;
      font-size: 12px;
      font-weight: 750;
    }

    .biotic-pressure-table {
      display: grid;
      gap: 0;
      width: 100%;

      font-size: 12px;
      line-height: 1.25;
    }

    .biotic-pressure-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 120px;
      gap: 12px;
      align-items: center;

      padding: 6px 0;

      border-bottom: 1px solid #e6eaed;
    }

    .biotic-pressure-row:last-child {
      border-bottom: none;
    }

    .biotic-pressure-name {
      min-width: 0;
    }

    .biotic-pressure-value {
      min-width: 0;

      color: var(--status-colour, #374151);
      font-weight: 750;
      text-align: right;
      white-space: nowrap;
    }

    .leaflet-popup.sturgeon-popup .leaflet-popup-content-wrapper {
      padding: 0;

      border: 1px solid rgba(20, 55, 80, 0.12);
      border-radius: 14px;

      background: rgba(255, 255, 255, 0.98);

      box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.18);

      overflow: hidden;
    }

    .leaflet-popup.sturgeon-popup .leaflet-popup-content {
      margin: 0;
    }

    .leaflet-popup.sturgeon-popup .leaflet-popup-tip-container {
      margin-top: -1px;
    }

    .leaflet-popup.sturgeon-popup .leaflet-popup-tip {
      background: rgba(255, 255, 255, 0.98);
      box-shadow: none;
    }

    .leaflet-popup.sturgeon-popup .leaflet-popup-close-button {
      display: none;
    }

    /* =====================================================
       ISOBATHS
       ===================================================== */

    .isobath-text {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
    }

    .isobath-text div {
      display: inline-block;

      transform: translate(-50%, -50%);

      color: rgba(29, 28, 28, 0.7);

      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;

      text-shadow:
        0 0 2px rgba(255, 255, 255, 0.8);
    }

    /* =====================================================
       BUOY POPUP
       ===================================================== */

    .buoy-popup {
      min-width: 120px;
    }

    .buoy-popup-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;

      margin-bottom: 4px;
    }

    .buoy-popup-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 24px;
      height: 24px;

      border: 1px solid #cfcfcf;
      border-radius: 6px;

      background: #f8f8f8;
      color: #17384f;

      font-size: 14px;
      text-decoration: none;
    }

    /* =====================================================
       SOUND
       ===================================================== */

    .sound-toggle {
      position: absolute;
      right: 12px;
      bottom: 68px;
      z-index: 1000;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 35px;
      height: 35px;

      border: none;
      border-radius: 50%;

      background: rgba(255, 255, 255, 0.95);

      box-shadow:
        0 6px 20px rgba(0, 0, 0, 0.2);

      cursor: pointer;
      font-size: 20px;
    }

    .leaflet-control-attribution {
      font-size: 11px;
    }

    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 640px) {
      html,
      body,
      #map {
        height: 100dvh;
      }

      .panel {
        top: 8px;
        left: 8px;

        transform: scale(0.61);
        transform-origin: top left;
      }

      .top-right {
        top: 8px;
        right: 8px;

        transform: scale(0.66);
        transform-origin: top right;
      }

      #userEmail {
        display: none;
      }

      .legend,
      .legend.is-biotic-mode {
        right: 8px;
        bottom: 70px;
        left: auto;

        width: min(280px, calc(100vw - 16px));
        max-height: 48vh;

        transform: none;
      }

      .legend-toggle {
        display: flex;
      }

      .legend-content {
        max-height: calc(48vh - 40px);
        padding-top: 4px;
      }

      .legend.is-collapsed {
        width: 142px;
      }

      .legend.is-collapsed .legend-content {
        display: none;
      }

      .sturgeon-popup-card,
      .biotic-popup-card {
        width: 280px;
        padding: 12px 14px;
      }

      .biotic-pressure-row {
        grid-template-columns: minmax(0, 1fr) 92px;
        gap: 8px;
      }

      .sound-toggle {
        right: 8px;
        bottom: 8px;

        transform: scale(0.76);
        transform-origin: bottom right;
      }

      .leaflet-control-scale {
        margin: 0 0 4px 4px !important;

        transform: scale(0.72);
        transform-origin: bottom left;
      }

      .leaflet-bottom.leaflet-right {
        right: 40px;
        bottom: 2px;

        max-width: 195px;
      }

      .leaflet-control-attribution {
        max-width: 185px;
        margin: 0 4px 4px 0 !important;

        overflow-wrap: anywhere;
        white-space: normal;

        font-size: 10px;
        line-height: 1.15;

        transform: scale(0.66);
        transform-origin: bottom right;
      }

      .legend-buoy.coastal {
        height: 34px;
      }

      .legend-buoy.offshore {
        height: 24px;
      }

      .isobath-text div {
        font-size: 10px;
      }
    }

    @media (max-width: 420px) {
      .panel {
        transform: scale(0.55);
      }

      .top-right {
        transform: scale(0.6);
      }

      .legend,
      .legend.is-biotic-mode {
        width: min(250px, calc(100vw - 16px));
      }

      .legend.is-collapsed {
        width: 136px;
      }

      .sturgeon-popup-card,
      .biotic-popup-card {
        width: 250px;
      }

      .sound-toggle {
        right: 8px;
        bottom: 8px;
        transform: scale(0.68);
      }

      .leaflet-control-attribution {
        max-width: 160px;
        transform: scale(0.56);
      }
    }



    /* Hide species list from the bottom-left legend */
    #speciesLegendSection {
      display: none !important;
    }


    /* Hide the instruction text to reduce panel height */
#panelHint {
  display: none !important;
}


    /* =====================================================
       MAP ATTRIBUTION
       ===================================================== */

    .leaflet-control-attribution {
      max-width: min(
        900px,
        calc(100vw - 90px)
      );

      box-sizing: border-box;
      padding: 4px 8px !important;

      background: rgba(
        255,
        255,
        255,
        0.94
      ) !important;

      border-top-left-radius: 4px;

      color: #334955;
      font-size: 10px;
      line-height: 1.3;
      text-align: right;
      white-space: normal;
    }

    .map-credit-main {
      color: #17384f;
      font-weight: 600;
    }

    .map-credit-line {
      display: block;
    }

    .map-credit-line + .map-credit-line {
      margin-top: 1px;
    }

    .map-credit-secondary {
      margin-top: 2px;

      color: #5a6670;
      font-size: 9px;
      font-weight: 400;
    }

    .map-credit-main a,
    .map-credit-secondary a {
      color: #175f8c;
      text-decoration: none;
    }

    .map-credit-main a:hover,
    .map-credit-secondary a:hover {
      text-decoration: underline;
    }

    .credit-separator {
      display: inline-block;
      margin: 0 4px;

      color: #7b8992;
    }

    @media (max-width: 640px) {
      .leaflet-bottom.leaflet-right {
        right: 42px;
        bottom: 2px;

        max-width: calc(
          100vw - 52px
        );
      }

      .leaflet-control-attribution {
        max-width: 300px;
        margin: 0 3px 3px 0 !important;
        padding: 4px 6px !important;

        databasePath

        const snapshot =
          await get(
            databaseRef(
              database,
              databasePath
            )
          );

        if (!snapshot.exists()) {
          throw new Error(
            `No data found at ${databasePath}.`
          );
        }

        const value =
          snapshot.val();

        /*
          Realtime Database normally returns imported arrays as arrays.
          This fallback also supports an object with numeric keys.
        */
        const features =
          Array.isArray(value?.features)
            ? value.features
            : value?.features &&
              typeof value.features === "object"
              ? Object.values(value.features)
              : null;

        if (
          value?.type !==
            "FeatureCollection" ||
          !Array.isArray(features)
        ) {

            `Invalid GeoJSON at ${databasePath}.`
          );
        }

        return {
          ...value,
          features
        };

              'input[name="speciesFilter"]:checked'

          "salinity-bar",

          `Dissolved oxygen (mmol/m3) - ` +
          `${monthLabels[month]}`;

        document.getElementById(
          "minV"
        ).textContent =
          range.min.toFixed(2);

        document.getElementById(
          "maxV"

      function updateLegendForCurrent(
        month

          currentRanges[month];

        document.getElementById(

        ).textContent =
          `Current velocity (m/s) - ` +
          `${monthLabels[month]}`;

        document.getElementById(
          "minV"

          "legendTitle"

          "Bathymetry (m)";

          "minV"
        ).textContent =

        document.getElementById(

      function makeTileLayer(path) {
        return L.tileLayer(
          path,
          {
            minZoom: TILE_MIN_ZOOM,
            maxZoom: TILE_MAX_ZOOM,
            opacity: 0.85
          }
        );
      }

      function updatePanelVisibility() {
        const layerType =
          document.getElementById(
            "layerType"
          ).value;

        const depth =
          document.getElementById(
            "depth"
          ).value;

        const depthRow =
          document.getElementById(
            "depthRow"
          );

        const monthRow =
          document.getElementById(
            "monthRow"
          );

        const hint =
          document.getElementById(
            "panelHint"
          );

        if (layerType === "bathymetry") {
          depthRow.style.display = "none";
          monthRow.style.display = "none";

          hint.textContent =
            "Bathymetry layer is displayed.";

          return;
        }

        if (
          layerType ===
          "dissolved_oxygen"
        ) {
          depthRow.style.display = "none";
          monthRow.style.display = "flex";

          hint.textContent =
            "Select month for dissolved oxygen.";

          return;
        }

        if (layerType === "current") {
          depthRow.style.display = "none";
          monthRow.style.display = "flex";

          hint.textContent =
            "Select month for current velocity.";

          return;
        }

        if (layerType === "salinity") {
          depthRow.style.display = "flex";

          if (depth === "bottom") {
            monthRow.style.display =
              "none";

            hint.textContent =
              "Bottom salinity has one fixed map.";
          } else {
            monthRow.style.display =
              "flex";

            hint.textContent =
              "Select depth and month.";
          }

          return;
        }

        depthRow.style.display = "flex";
        monthRow.style.display = "flex";

        hint.textContent =
          "Select depth and month.";
      }

      function refreshRaster() {
        const layerType =
          document.getElementById(
            "layerType"
          ).value;

        const depth =
          document.getElementById(
            "depth"
          ).value;

        const month =
          document.getElementById(
            "month"
          ).value;

        updatePanelVisibility();

        if (currentRaster) {
          map.removeLayer(
            currentRaster
          );
        }

        if (layerType === "bathymetry") {
          currentRaster =
            makeTileLayer(
              `${TILE_ROOT}/bathymetry/{z}/{x}/{y}.png`
            );

          updateLegendForBathymetry();
        } else if (
          layerType ===
          "dissolved_oxygen"
        ) {
          currentRaster =
            makeTileLayer(
              `${TILE_ROOT}/dissolved_oxygen/` +
              `${month}/{z}/{x}/{y}.png`
            );

          updateLegendForDissolvedOxygen(
            month
          );
        } else if (
          layerType === "current"
        ) {
          currentRaster =
            makeTileLayer(
              `${TILE_ROOT}/current/` +
              `${month}/{z}/{x}/{y}.png`
            );

          updateLegendForCurrent(
            month
          );
        } else if (
          layerType === "salinity"
        ) {
          const path =
            depth === "bottom"
              ? `${TILE_ROOT}/salinity/bottom/default/{z}/{x}/{y}.png`
              : `${TILE_ROOT}/salinity/surface/${month}/{z}/{x}/{y}.png`;

          currentRaster =
            makeTileLayer(path);

          updateLegendForSalinity(
            depth,
            month
          );
        } else {
          currentRaster =
            makeTileLayer(
              `${TILE_ROOT}/${depth}/` +
              `${month}/{z}/{x}/{y}.png`
            );

          updateLegendForTemperature(
            depth,
            month
          );
        }

        currentRaster.addTo(map);
        keepOverlaysOnTop();
      }

      function keepOverlaysOnTop() {
        if (izobateLayer) {
          izobateLayer.bringToFront();
        }

        isobathLabelLayer.eachLayer(
          layer => {
            if (layer.bringToFront) {
              layer.bringToFront();
            }
          }
        );

        if (
          habitatLayer &&
          map.hasLayer(habitatLayer)
        ) {
          habitatLayer.bringToFront();
        }
      }

      function getMidpointFromCoords(
        coordinates
      ) {
        if (
          !coordinates ||
          !coordinates.length
        ) {
          return null;
        }

        const middle =
          coordinates[
            Math.floor(
              coordinates.length / 2
            )
          ];

        if (
          !middle ||
          middle.length < 2
        ) {
          return null;
        }

        return [
          middle[1],
          middle[0]
        ];
      }

      function getLabelPointFromGeometry(
        geometry
      ) {
        if (!geometry) {
          return null;
        }

        if (
          geometry.type ===
          "LineString"
        ) {
          return getMidpointFromCoords(
            geometry.coordinates
          );
        }

        if (
          geometry.type ===
          "MultiLineString"
        ) {
          let longest = null;

          geometry.coordinates.forEach(
            line => {
              if (
                !longest ||
                line.length >
                  longest.length
              ) {
                longest = line;
              }
            }
          );

          return longest
            ? getMidpointFromCoords(
                longest
              )
            : null;
        }

        return null;
      }

      function addIsobathLabel(
        feature,
        value
      ) {
        const point =
          getLabelPointFromGeometry(
            feature.geometry
          );

        if (!point) {
          return;
        }

        isobathLabelLayer.addLayer(
          L.marker(
            point,
            {
              interactive: false,

              icon: L.divIcon({
                className:
                  "isobath-text",

                html:
                  `<div>${escapeHtml(value)} m</div>`,

                iconSize: null
              })
            }
          )
        );
      }

      function makeSiteIcon(
        speciesKeys
      ) {
        const visibleKeys =
          speciesKeys.filter(
            key => speciesConfig[key]
          );

        const width =
          Math.max(
            14,
            visibleKeys.length * 16
          );

        const symbols =
          visibleKeys
            .map(
              key => `
                <span class="site-marker-symbol">
                  ${createShapeHtml(key)}
                </span>
              `
            )
            .join("");

        return L.divIcon({
          className:
            "site-marker-icon",

          html: `
            <div class="site-marker-cluster">
              ${symbols}
            </div>
          `,

          iconSize: [
            width,
            22
          ],

          iconAnchor: [
            width / 2,
            11
          ],

          tooltipAnchor: [
            0,
            -14
          ]
        });
      }

      function getObservationLayer() {
        return document.getElementById(
          "observationLayer"
        ).value;
      }

      function updateSpeciesLegend() {
        const section =
          document.getElementById(
            "speciesLegendSection"
          );

        const container =
          document.getElementById(
            "speciesLegendItems"
          );

        const selectedKeys =
          getSelectedSpeciesKeys();

        if (
          getObservationLayer() !== "edna" ||
          !selectedKeys.length
        ) {
          section.classList.add(
            "hidden"
          );

          container.innerHTML = "";
          return;
        }

        container.innerHTML =
          selectedKeys
            .map(key => {
              const config =
                speciesConfig[key];

              return `
                <div class="species-legend-item">
                  <span class="species-legend-symbol">
                    ${createShapeHtml(key)}
                  </span>

                  <em>
                    ${escapeHtml(config.label)}
                  </em>
                </div>
              `;
            })
            .join("");

        section.classList.remove(
          "hidden"
        );
      }

      function hideObservationPopup() {
        map.closePopup();
      }

      function buildAreaPopupHtml(
        area,
        visibleSpeciesKeys
      ) {
        const waterType =
          area.waterType ||
          "Not available";

        const samplingPeriod =
          area.samplingPeriod ||
          "Not available";

        const firstSpecies =
          speciesConfig[
            visibleSpeciesKeys[0]
          ];

        const areaTitle =
          escapeHtml(
            area.areaName ||
            `Area ${area.areaId}`
          ).trim();

        const speciesRows =
          visibleSpeciesKeys
            .map(key => {
              const config =
                speciesConfig[key];

              return `
                <div
                  class="detected-species-item"
                  style="--item-colour:${config.colour};"
                >
                  <span class="species-legend-symbol">
                    ${createShapeHtml(key)}
                  </span>

                  <em>
                    ${escapeHtml(config.label)}
                  </em>
                </div>
              `;
            })
            .join("");

        return `
          <div
            class="sturgeon-popup-card"
            style="--summary-colour:${firstSpecies?.colour || "#17384f"};"
          >
            <div class="species-info-title">${areaTitle}</div>

            <div class="detected-species-list">
              ${speciesRows}
            </div>

            <div class="site-meta">
              <div class="site-meta-label">
                Water type
              </div>

              <div>
                ${escapeHtml(waterType)}
              </div>

              <div class="site-meta-label">
                Sampling period
              </div>

              <div>
                ${escapeHtml(samplingPeriod)}
              </div>
            </div>
          </div>
        `;
      }

      function areaPassesFilters(
        area,
        selectedKeys,
        waterFilter,
        periodFilter
      ) {
        const visibleSpecies =
          area.species.filter(
            key =>
              selectedKeys.includes(key)
          );

        if (!visibleSpecies.length) {
          return false;
        }

        if (
          waterFilter !== "all" &&
          normaliseText(
            area.waterType
          ) !== waterFilter
        ) {
          return false;
        }

        if (
          periodFilter !== "all" &&
          area.samplingPeriod !==
            periodFilter
        ) {
          return false;
        }

        return true;
      }

      function fitObservationBounds(
        bounds
      ) {
        if (!bounds.length) {
          return;
        }

        const mobile =
          window.innerWidth <= 640;

        map.fitBounds(
          L.latLngBounds(bounds),
          {
            paddingTopLeft:
              mobile
                ? [30, 100]
                : [60, 60],

            paddingBottomRight:
              mobile
                ? [30, 100]
                : [60, 60],

            maxZoom: 7
          }
        );
      }

      function refreshSturgeonMarkers({
        fitToMarkers = false
      } = {}) {
        sturgeonLayer.clearLayers();
        hideObservationPopup();
        updateSpeciesLegend();

        if (
          getObservationLayer() !==
          "edna"
        ) {
          return;
        }

        const selectedKeys =
          getSelectedSpeciesKeys();

        const waterFilter =
          document.getElementById(
            "waterTypeFilter"
          ).value;

        const periodFilter =
          document.getElementById(
            "samplingPeriodFilter"
          ).value;

        if (!selectedKeys.length) {
          return;
        }

        const bounds = [];

        sturgeonAreas.forEach(
          area => {
            if (
              !areaPassesFilters(
                area,
                selectedKeys,
                waterFilter,
                periodFilter
              )
            ) {
              return;
            }

            const visibleSpecies =
              area.species.filter(
                key =>
                  selectedKeys.includes(
                    key
                  ) &&
                  speciesConfig[key]
              );

            const marker =
              L.marker(
                [
                  area.lat,
                  area.lon
                ],
                {
                  icon:
                    makeSiteIcon(
                      visibleSpecies
                    ),

                  keyboard: true,
                  zIndexOffset: 1200
                }
              );

            const popupHtml =
              buildAreaPopupHtml(
                area,
                visibleSpecies
              );

            marker.bindPopup(
              popupHtml,
              {
                className: "sturgeon-popup",
                closeButton: false,
                autoClose: true,
                closeOnClick: true,
                offset: [0, -10]
              }
            );

            marker.on(
              "mouseover",
              () => marker.openPopup()
            );

            marker.on(
              "click",
              () => marker.openPopup()
            );

            marker.addTo(
              sturgeonLayer
            );

            bounds.push([
              area.lat,
              area.lon
            ]);
          }
        );

        if (fitToMarkers) {
          fitObservationBounds(bounds);
        }
      }

      function normaliseSamplingPeriod(
        value
      ) {
        return String(value ?? "")
          .replace(/\bJune\b/gi, "Jun")
          .replace(/\s+/g, " ")
          .trim();
      }

      function updateBioticPressureSelectStyle() {
        const select =
          document.getElementById(
            "bioticPressureType"
          );

        const selectedPressure =
          pressureConfig[select.value];

        select.classList.toggle(
          "scientific-selected",
          Boolean(
            selectedPressure?.scientific
          )
        );
      }

      function getPressureLevel(
        pressureKey,
        rawValue
      ) {
        const pressure =
          pressureConfig[pressureKey];

        if (!pressure) {
          return categoryPressureLevels.na;
        }

        if (pressure.type === "gene") {
          const numericValue =
            Number(rawValue);

          return (
            genePressureLevels[
              numericValue
            ] ||
            genePressureLevels.na
          );
        }

        const category =
          normaliseText(rawValue) ||
          "na";

        return (
          categoryPressureLevels[
            category
          ] ||
          categoryPressureLevels.na
        );
      }

      function formatPressurePopupValue(
        pressureKey,
        rawValue
      ) {
        const pressure =
          pressureConfig[pressureKey];

        const level =
          getPressureLevel(
            pressureKey,
            rawValue
          );

        if (
          normaliseText(rawValue) === "na" ||
          rawValue === null ||
          rawValue === undefined ||
          rawValue === ""
        ) {
          return "NA";
        }

        if (pressure?.type === "gene") {
          return level.label;
        }

        return level.popupLabel ||
          level.label;
      }

      function makeBioticIcon(
        area,
        pressureKey
      ) {
        const level =
          getPressureLevel(
            pressureKey,
            area.pressures[
              pressureKey
            ]
          );

        const areaName =
          area.areaName ||
          `Area ${area.areaId}`;

        return L.divIcon({
          className:
            "biotic-marker-icon",

          html: `
            <div
              class="biotic-pressure-marker"
              style="--pressure-colour:${level.colour};"
              title="${escapeHtml(areaName)}"
              aria-label="${escapeHtml(areaName)}"
            ></div>
          `,

          iconSize: [22, 22],
          iconAnchor: [11, 11],
          popupAnchor: [0, -14]
        });
      }

      function buildBioticPopupHtml(
        area,
        selectedPressureKey
      ) {
        const selectedLevel =
          getPressureLevel(
            selectedPressureKey,
            area.pressures[
              selectedPressureKey
            ]
          );

        const areaTitle =
          escapeHtml(
            area.areaName ||
            `Area ${area.areaId}`
          ).trim();

        return `
          <div
            class="biotic-popup-card"
            style="--summary-colour:${selectedLevel.colour};"
          >
            <div class="species-info-title">${areaTitle}</div>

            <div class="site-meta">
              <div class="site-meta-label">
                Water type
              </div>

              <div>
                ${escapeHtml(area.waterType || "Not available")}
              </div>

              <div class="site-meta-label">
                Sampling period
              </div>

              <div>
                ${escapeHtml(area.samplingPeriod || "Not available")}
              </div>
            </div>
          </div>
        `;
      }

      function bioticAreaPassesFilters(
        area,
        waterFilter,
        periodFilter
      ) {
        if (
          waterFilter !== "all" &&
          normaliseText(
            area.waterType
          ) !== waterFilter
        ) {
          return false;
        }

        if (
          periodFilter !== "all" &&
          area.samplingPeriod !==
            periodFilter
        ) {
          return false;
        }

        return true;
      }

      function updateBioticLegend() {
        const section =
          document.getElementById(
            "bioticLegendSection"
          );

        const subtitle =
          document.getElementById(
            "bioticLegendSubtitle"
          );

        const container =
          document.getElementById(
            "bioticLegendItems"
          );

        if (
          getObservationLayer() !==
          "biotic"
        ) {
          section.classList.add(
            "hidden"
          );

          subtitle.textContent = "";
          container.innerHTML = "";
          return;
        }

        const pressureKey =
          document.getElementById(
            "bioticPressureType"
          ).value;

        const pressure =
          pressureConfig[pressureKey];

        subtitle.textContent =
          pressure?.shortLabel ||
          "Selected pressure";

        subtitle.classList.toggle(
          "is-scientific",
          Boolean(pressure?.scientific)
        );

        const levels =
          pressure?.type === "gene"
            ? [
                genePressureLevels[1],
                genePressureLevels[2],
                genePressureLevels[3],
                genePressureLevels[4],
                genePressureLevels[5],
                genePressureLevels.na
              ]
            : [
                categoryPressureLevels.rare,
                categoryPressureLevels.occasional,
                categoryPressureLevels.frequent,
                categoryPressureLevels.constant,
                categoryPressureLevels.na
              ];

        container.innerHTML =
          levels
            .map(level => `
              <div class="pressure-legend-item">
                <span
                  class="pressure-legend-swatch"
                  style="--pressure-colour:${level.colour};"
                ></span>

                <span>${escapeHtml(level.label)}</span>
              </div>
            `)
            .join("");

        section.classList.remove(
          "hidden"
        );
      }

      function refreshBioticMarkers({
        fitToMarkers = false
      } = {}) {
        bioticLayer.clearLayers();
        hideObservationPopup();
        updateBioticLegend();

        if (
          getObservationLayer() !==
          "biotic"
        ) {
          return;
        }

        const pressureKey =
          document.getElementById(
            "bioticPressureType"
          ).value;

        const waterFilter =
          document.getElementById(
            "bioticWaterTypeFilter"
          ).value;

        const periodFilter =
          document.getElementById(
            "bioticSamplingPeriodFilter"
          ).value;

        const bounds = [];

        bioticAreas.forEach(area => {
          if (
            !bioticAreaPassesFilters(
              area,
              waterFilter,
              periodFilter
            )
          ) {
            return;
          }

          const marker =
            L.marker(
              [
                area.lat,
                area.lon
              ],
              {
                icon:
                  makeBioticIcon(
                    area,
                    pressureKey
                  ),

                keyboard: true,
                zIndexOffset: 1250
              }
            );

          marker.bindPopup(
            buildBioticPopupHtml(
              area,
              pressureKey
            ),
            {
              className: "sturgeon-popup biotic-popup",
              closeButton: false,
              autoClose: true,
              closeOnClick: true,
              minWidth:
                window.innerWidth <= 640
                  ? 250
                  : 390,
              maxWidth:
                window.innerWidth <= 640
                  ? 280
                  : 430,
              offset: [0, -8]
            }
          );

          marker.on(
            "mouseover",
            () => marker.openPopup()
          );

          marker.on(
            "click",
            () => marker.openPopup()
          );

          marker.addTo(
            bioticLayer
          );

          bounds.push([
            area.lat,
            area.lon
          ]);
        });

        if (fitToMarkers) {
          fitObservationBounds(bounds);
        }
      }

      function updateObservationControls({
        fitToMarkers = false
      } = {}) {
        const mode =
          getObservationLayer();

        const legendBox =
          document.getElementById(
            "legend"
          );

        legendBox.classList.toggle(
          "is-biotic-mode",
          mode === "biotic"
        );

        const ednaControls =
          document.getElementById(
            "ednaControls"
          );

        const bioticControls =
          document.getElementById(
            "bioticControls"
          );

        ednaControls.classList.toggle(
          "hidden",
          mode !== "edna"
        );

        bioticControls.classList.toggle(
          "hidden",
          mode !== "biotic"
        );

        sturgeonLayer.clearLayers();
        bioticLayer.clearLayers();
        hideObservationPopup();
        updateSpeciesLegend();
        updateBioticLegend();

        if (mode === "edna") {
          refreshSturgeonMarkers({
            fitToMarkers
          });
        } else if (mode === "biotic") {
          refreshBioticMarkers({
            fitToMarkers
          });
        }
      }

      function populateSamplingSelect(
        selectId,
        periods
      ) {
        const select =
          document.getElementById(
            selectId
          );

        select.innerHTML = `
          <option value="all">
            All periods
          </option>
        `;

        periods.forEach(period => {
          const option =
            document.createElement(
              "option"
            );

          option.value = period;
          option.textContent = period;

          select.appendChild(
            option
          );
        });
      }

      function populateSamplingPeriods() {
        const periods =
          Array.from(
            new Set(
              sturgeonAreas
                .map(
                  area =>
                    area.samplingPeriod
                )
                .filter(Boolean)
            )
          ).sort(
            (a, b) =>
              a.localeCompare(b)
          );

        populateSamplingSelect(
          "samplingPeriodFilter",
          periods
        );
      }

      function populateBioticSamplingPeriods() {
        const periods =
          Array.from(
            new Set(
              bioticAreas
                .map(
                  area =>
                    area.samplingPeriod
                )
                .filter(Boolean)
            )
          ).sort(
            (a, b) =>
              a.localeCompare(b)
          );

        populateSamplingSelect(
          "bioticSamplingPeriodFilter",
          periods
        );
      }

      async function loadSturgeonAreas() {
        const geojson =
          await loadProtectedGeoJSON(
            "geojson/sturgeon_edna"
          );

        if (
          geojson.type !==
            "FeatureCollection" ||
          !Array.isArray(
            geojson.features
          )
        ) {
          throw new Error(
            "Invalid sturgeon eDNA GeoJSON."
          );
        }

        sturgeonAreas =
          geojson.features
            .map(feature => {
              const properties =
                feature.properties ||
                {};

              const coordinates =
                feature.geometry
                  ?.coordinates ||
                [];

              return {
                areaId:
                  properties.area_id,

                areaName:
                  properties.area_name ||
                  `Area ${properties.area_id}`,

                lat:
                  Number(
                    coordinates[1]
                  ),

                lon:
                  Number(
                    coordinates[0]
                  ),

                waterType:
                  properties.water_type ||
                  "",

                samplingPeriod:
                  properties.sampling_months ||
                  "",

                species:
                  Array.isArray(
                    properties.species
                  )
                    ? properties.species
                    : []
              };
            })
            .filter(
              area =>
                area.areaId !==
                  undefined &&
                area.areaId !== null &&
                Number.isFinite(
                  area.lat
                ) &&
                Number.isFinite(
                  area.lon
                )
            );

        populateSamplingPeriods();
      }

      async function loadBioticAreas() {
        const geojson =
          await loadProtectedGeoJSON(
            "geojson/biotic_pressures"
          );

        if (
          geojson.type !==
            "FeatureCollection" ||
          !Array.isArray(
            geojson.features
          )
        ) {
          throw new Error(
            "Invalid biotic pressure GeoJSON."
          );
        }

        const coordinatesByArea =
          new Map(
            sturgeonAreas.map(area => [
              String(area.areaId),
              {
                lat: area.lat,
                lon: area.lon,
                areaName: area.areaName
              }
            ])
          );

        bioticAreas =
          geojson.features
            .map(feature => {
              const properties =
                feature.properties ||
                {};

              const areaId =
                properties.area_id;

              const coordinates =
                coordinatesByArea.get(
                  String(areaId)
                );

              return {
                areaId,

                areaName:
                  coordinates?.areaName ||
                  `Area ${areaId}`,

                lat: coordinates?.lat,
                lon: coordinates?.lon,

                waterType:
                  properties.water_type ||
                  "",

                samplingPeriod:
                  normaliseSamplingPeriod(
                    properties.sampling_period
                  ),

                pressures: {
                  N_melanostomus:
                    properties.N_melanostomus,

                  M_leidyi:
                    properties.M_leidyi,

                  mycE_gene:
                    properties.mycE_gene,

                  sxtA_gene:
                    properties.sxtA_gene
                }
              };
            })
            .filter(
              area =>
                area.areaId !==
                  undefined &&
                area.areaId !== null &&
                Number.isFinite(
                  area.lat
                ) &&
                Number.isFinite(
                  area.lon
                )
            );

        populateBioticSamplingPeriods();
      }

      async function loadObservationData() {
        try {
          await loadSturgeonAreas();

          updateObservationControls({
            fitToMarkers: false
          });
        } catch (error) {
          console.error(
            "Sturgeon eDNA data not loaded:",
            error
          );

          return;
        }

        try {
          await loadBioticAreas();

          if (
            getObservationLayer() ===
            "biotic"
          ) {
            refreshBioticMarkers({
              fitToMarkers: false
            });
          }
        } catch (error) {
          console.error(
            "Biotic pressure data not loaded:",
            error
          );
        }
      }

      loadProtectedGeoJSON(
        "geojson/isobaths"
      )
        .then(geojson => {
          isobathLabelLayer.clearLayers();

          izobateLayer =
            L.geoJSON(
              geojson,
              {
                style: {
                  color: "#7f7f7f",
                  weight: 1.5,
                  opacity: 0.9
                },

                onEachFeature(
                  feature,
                  layer
                ) {
                  const properties =
                    feature.properties ||
                    {};

                  const value =
                    properties.value ??
                    properties.VALUE ??
                    properties.depth ??
                    properties.DEPTH ??
                    properties.Depth ??
                    null;

                  if (value !== null) {
                    layer.bindPopup(
                      `Isobath: ${escapeHtml(value)} m`
                    );

                    addIsobathLabel(
                      feature,
                      value
                    );
                  }
                }
              }
            ).addTo(map);

          keepOverlaysOnTop();
        })
        .catch(error => {
          console.log(
            "Isobaths not loaded:",
            error
          );
        });

      loadProtectedGeoJSON(
        "geojson/sturgeon_habitat"
      )
        .then(geojson => {
          habitatLayer =
            L.geoJSON(
              geojson,
              {
                style() {
                  if (hatchPattern) {
                    return {
                      color: "#28a745",
                      weight: 1,

                      fillPattern:
                        hatchPattern,

                      fillOpacity: 1
                    };
                  }

                  return {
                    color: "#28a745",
                    weight: 1,
                    fillColor: "#b9e7c3",
                    fillOpacity: 0.35
                  };
                }
              }
            );
        })
        .catch(error => {
          console.log(
            "Habitat not loaded:",
            error
          );
        });

      const offshoreBuoyIcon =
        L.icon({
          iconUrl:
            "buoy_offshore.png",

          iconSize:
            [40, 40],

          iconAnchor:
            [20, 20],

          popupAnchor:
            [0, -16]
        });

      const coastalBuoyIcon =
        L.icon({
          iconUrl:
            "buoy_coastal.png",

          iconSize:
            [40, 70],

          iconAnchor:
            [20, 65],

          popupAnchor:
            [0, -36]
        });

      loadProtectedGeoJSON(
        "geojson/buoys"
      )
        .then(geojson => {
          L.geoJSON(
            geojson,
            {
              pointToLayer(
                feature,
                latlng
              ) {
                const type =
                  String(
                    feature.properties
                      ?.type ||
                    ""
                  ).toLowerCase();

                return L.marker(
                  latlng,
                  {
                    icon:
                      type === "coastal"
                        ? coastalBuoyIcon
                        : offshoreBuoyIcon
                  }
                );
              },

              onEachFeature(
                feature,
                layer
              ) {
                const properties =
                  feature.properties ||
                  {};

                const name =
                  properties.name ||
                  "Buoy";

                const type =
                  properties.type ||
                  "unknown";

                const infoUrl =
                  "https://www.euxinus.eu/" +
                  "emso_euxinus_network.html";

                layer.bindPopup(`
                  <div class="buoy-popup">
                    <div class="buoy-popup-header">
                      <strong>
                        ${escapeHtml(name)}
                      </strong>

                      <a
                        href="${infoUrl}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="buoy-popup-link"
                        title="Open EMSO-EUXINUS page"
                      >
                        &#9993;
                      </a>
                    </div>

                    <div>
                      Type: ${escapeHtml(type)}
                    </div>
                  </div>
                `);
              }
            }
          ).addTo(map);

          keepOverlaysOnTop();
        })
        .catch(error => {
          console.log(
            "Buoys not loaded:",
            error
          );
        });

      document
        .getElementById(
          "habitatToggle"
        )
        .addEventListener(
          "change",
          function () {
            if (!habitatLayer) {
              return;
            }

            if (this.checked) {
              habitatLayer.addTo(map);
              keepOverlaysOnTop();
            } else {
              map.removeLayer(
                habitatLayer
              );
            }
          }
        );

      document
        .getElementById(
          "layerType"
        )
        .addEventListener(
          "change",
          refreshRaster
        );

      document
        .getElementById(
          "depth"
        )
        .addEventListener(
          "change",
          refreshRaster
        );

      document
        .getElementById(
          "month"
        )
        .addEventListener(
          "change",
          refreshRaster
        );

      document
        .getElementById(
          "observationLayer"
        )
        .addEventListener(
          "change",
          () => {
            updateObservationControls({
              fitToMarkers: true
            });
          }
        );

      document
        .querySelectorAll(
          'input[name="speciesFilter"]'
        )
        .forEach(input => {
          input.addEventListener(
            "change",
            () => {
              refreshSturgeonMarkers({
                fitToMarkers: true
              });
            }
          );
        });

      document
        .getElementById(
          "waterTypeFilter"
        )
        .addEventListener(
          "change",
          () => {
            refreshSturgeonMarkers({
              fitToMarkers: true
            });
          }
        );

      document
        .getElementById(
          "samplingPeriodFilter"
        )
        .addEventListener(
          "change",
          () => {
            refreshSturgeonMarkers({
              fitToMarkers: true
            });
          }
        );

      document
        .getElementById(
          "bioticPressureType"
        )
        .addEventListener(
          "change",
          () => {
            updateBioticPressureSelectStyle();

            refreshBioticMarkers({
              fitToMarkers: false
            });
          }
        );

      document
        .getElementById(
          "bioticWaterTypeFilter"
        )
        .addEventListener(
          "change",
          () => {
            refreshBioticMarkers({
              fitToMarkers: true
            });
          }
        );

      document
        .getElementById(
          "bioticSamplingPeriodFilter"
        )
        .addEventListener(
          "change",
          () => {
            refreshBioticMarkers({
              fitToMarkers: true
            });
          }
        );

      updatePanelVisibility();
      updateBioticPressureSelectStyle();
      refreshRaster();
      updateObservationControls({
        fitToMarkers: false
      });
      loadObservationData();
    }
  </script>

  <script>
    const legend =
      document.getElementById(
        "legend"
      );

    const legendToggle =
      document.getElementById(
        "legendToggle"
      );

    const legendToggleIcon =
      document.getElementById(
        "legendToggleIcon"
      );

    function updateLegendToggleState() {
      const collapsed =
        legend.classList.contains(
          "is-collapsed"
        );

      legendToggle.setAttribute(
        "aria-expanded",
        String(!collapsed)
      );

      legendToggleIcon.textContent =
        collapsed ? "▼" : "▲";
    }

    if (window.innerWidth <= 640) {
      legend.classList.add(
        "is-collapsed"
      );
    }

    updateLegendToggleState();

    legendToggle.addEventListener(
      "click",
      () => {
        legend.classList.toggle(
          "is-collapsed"
        );

        updateLegendToggleState();
      }
    );

    window.addEventListener(
      "resize",
      () => {
        if (window.innerWidth > 640) {
          legend.classList.remove(
            "is-collapsed"
          );

          updateLegendToggleState();
        }
      }
    );

    const seaSound =
      document.getElementById(
        "seaSound"
      );

    const soundToggle =
      document.getElementById(
        "soundToggle"
      );

    let soundEnabled =
      localStorage.getItem(
        "seaSoundEnabled"
      ) === "true";

    function updateSoundIcon() {
      soundToggle.textContent =
        soundEnabled
          ? "🔊"
          : "🔇";
    }

    async function turnSoundOn() {
      try {
        seaSound.volume = 0.8;

        await seaSound.play();

        soundEnabled = true;

        localStorage.setItem(
          "seaSoundEnabled",
          "true"
        );

        updateSoundIcon();
      } catch (error) {
        console.log(
          "Sound blocked by browser.",
          error
        );
      }
    }

    function turnSoundOff() {
      seaSound.pause();
      seaSound.currentTime = 0;

      soundEnabled = false;

      localStorage.setItem(
        "seaSoundEnabled",
        "false"
      );

      updateSoundIcon();
    }

    soundToggle.addEventListener(
      "click",
      async () => {
        if (soundEnabled) {
          turnSoundOff();
        } else {
          await turnSoundOn();
        }
      }
    );

    updateSoundIcon();

    window.addEventListener(
      "load",
      async () => {
        if (!soundEnabled) {
          return;
        }

        try {
          seaSound.volume = 0.35;
          await seaSound.play();
        } catch (error) {
          console.log(
            "Autoplay blocked.",
            error
          );
        }
      }
    );
  </script>
</body>
</html>
